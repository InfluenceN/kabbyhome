name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build Kabby Home for GitHub Pages
        working-directory: website
        env:
          SITE_ORIGIN: https://influencen.github.io
          BASE_PATH: kabbyhome
        run: node build-pages.mjs
      - name: Verify Pages artifact
        env:
          SITE_ORIGIN: https://influencen.github.io
          BASE_PATH: kabbyhome
        working-directory: website
        run: node check-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
